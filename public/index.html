<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090C0A" />
    <meta name="description" content="Ball-by-ball scoring and player stats for your local cricket matches." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Crease" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background-color: #090C0A;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      // Offline support: only the built site has a service worker (npm run build:web), not the dev server.
      if ('serviceWorker' in navigator && !['localhost', '127.0.0.1', '[::1]', '::1'].includes(location.hostname)) {
        // A new version waits until the user says so: reloading by itself could drop someone out of the match they're
        // scoring. A small banner offers it; Reload tells the waiting version to take over, and the page reloads once.
        var offer = function (worker) {
          if (!worker || document.getElementById('crease-update')) return;
          var bar = document.createElement('div');
          bar.id = 'crease-update';
          bar.setAttribute('role', 'status');
          bar.style.cssText =
            'position:fixed;z-index:2147483647;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top, 0px) + 10px);' +
            'display:flex;align-items:center;gap:6px;padding:4px 4px 4px 16px;border-radius:999px;max-width:calc(100% - 32px);' +
            'background:#121814;color:#F1F5EE;border:1px solid rgba(255,255,255,0.12);box-shadow:0 8px 24px rgba(0,0,0,0.35);' +
            'font:600 14px/1.2 Inter_600SemiBold, system-ui, -apple-system, sans-serif;white-space:nowrap';
          var text = document.createElement('span');
          text.textContent = 'Update ready';
          var go = document.createElement('button');
          go.type = 'button';
          go.textContent = 'Reload';
          go.style.cssText =
            'min-height:44px;padding:0 18px;border:0;border-radius:999px;background:#D7FF3A;color:#0A0D06;font:inherit;font-weight:700;cursor:pointer';
          var later = document.createElement('button');
          later.type = 'button';
          later.textContent = '\u2715';
          later.setAttribute('aria-label', 'Later');
          later.style.cssText = 'width:44px;height:44px;border:0;border-radius:999px;background:transparent;color:inherit;font:inherit;cursor:pointer';
          go.onclick = function () {
            go.disabled = true;
            worker.postMessage({ type: 'SKIP_WAITING' });
          };
          later.onclick = function () {
            bar.remove();
          };
          bar.append(text, go, later);
          document.body.appendChild(bar);
        };
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').then(function (reg) {
            if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
            reg.addEventListener('updatefound', function () {
              var next = reg.installing;
              if (!next) return;
              next.addEventListener('statechange', function () {
                // Installed while an older version runs the page: that's an update (the first install isn't).
                if (next.state === 'installed' && navigator.serviceWorker.controller) offer(next);
              });
            });
            // A phone left open at the ground: look for a new version whenever the app comes back to the front.
            document.addEventListener('visibilitychange', function () {
              if (document.visibilityState === 'visible') reg.update().catch(function () {});
            });
          });
        });
        // The new version took over because Reload was tapped: reload once so the page and its files match.
        var hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (hadController && !window.__creaseReloaded) {
            window.__creaseReloaded = true;
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
